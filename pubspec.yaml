name: patra
description: "A Flutter client for Kavita — manga, comics and books from your own server."
publish_to: 'none'
# Only the default a local build falls back to. A release takes its version
# from the git tag (--build-name) and its build number from the CI run, and
# the app reads both back off the binary; see CLAUDE.md.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.0
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  flutter_slidable: ^4.0.3
  go_router: ^18.0.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # `flutter drive` for the store screenshots: the recipe lives in
  # `integration_test/`, the half that writes the files in `test_driver/`.
  # Both ship with the SDK; neither is a package to keep up with.
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/SpaceGrotesk-OFL.txt
    - assets/fonts/Literata-OFL.txt
    - assets/fonts/AtkinsonHyperlegibleNext-OFL.txt
  # Bundled rather than fetched: the app is a reader, and a reader is opened
  # on a train, and a book saved for one (#77) has to open in the face its
  # reader chose with no server to ask. Every face is variable, so one file
  # answers every weight, and the two a book can be set in ship with their
  # italic, so a book's emphasis has somewhere to be set. Space Grotesk is
  # the interface's sans alone and has no italic at all; see
  # ReadingFace.resolve.
  # The serif is both the interface's and a book's — one family, one file —
  # which is why the app ships three faces and not four.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
          weight: 400
        - asset: assets/fonts/Literata-Variable.ttf
          weight: 500
        - asset: assets/fonts/Literata-Variable.ttf
          weight: 600
        - asset: assets/fonts/Literata-Variable.ttf
          weight: 700
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
          weight: 700
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic-Variable.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic-Variable.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic-Variable.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic-Variable.ttf
          style: italic
          weight: 700

# App icons are generated from the master in assets/icon/ by
#   ./tool/gen_app_icons.sh
# and not by flutter_launcher_icons. The script also leaves the Android
# adaptive icon alone — its foreground is the vector
# res/drawable/patra_mark.xml, shared with nothing and hand-kept. See CLAUDE.md.
