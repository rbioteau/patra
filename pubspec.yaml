name: verso
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_slidable: ^4.0.3
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# App icons are generated from the master mark by flutter_launcher_icons:
#   dart run flutter_launcher_icons
# The ink tile colour matches the brand mark, so the Android adaptive
# foreground can sit on it seamlessly.
flutter_launcher_icons:
  image_path: "assets/icon/verso-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # The Android adaptive icon is not generated: its foreground is the vector
  # drawable/verso_mark.xml, shared with the splash screen, and this tool can
  # only rasterise a PNG foreground (and would rewrite the XML with an inset
  # that double-pads it). Do not add adaptive_icon_* keys here.
