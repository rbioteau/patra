name: patra
description: "A Flutter client for Kavita — manga, comics and books from your own server."
publish_to: 'none'
# Only the default a local build falls back to. A release takes its version
# from the git tag (--build-name) and its build number from the CI run, and
# the app reads both back off the binary; see CLAUDE.md.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.0
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_slidable: ^4.0.3
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

# App icons are generated from the two masters in assets/icon/ by
#   ./tool/gen_app_icons.sh
# and not by flutter_launcher_icons, which rasterises a single master to every
# size: the handoff renders anything at or under 72px from the *compact*
# three-blade frond, because five blades close into a blob there. The script
# also leaves the Android adaptive icon alone — its foreground is the vector
# res/drawable/patra_mark.xml, shared with nothing and hand-kept. See CLAUDE.md.
