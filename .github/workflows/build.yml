name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: verso-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Unsigned release build: no Apple Developer account. The IPA artifact
      # can be sideloaded on a device after re-signing (AltStore/Sideloadly);
      # release mode is required — debug Flutter builds need JIT, which iOS
      # forbids outside a debugger. TestFlight upload will come later.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr verso-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: verso-unsigned-ipa
          path: verso-unsigned.ipa
