name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    env:
      PACKAGE_NAME: io.github.rbioteau.patra
      AAB: build/app/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The same rule the iOS job follows. Signing material reaches this job
      # only on a push to main — a fork PR is handed no secrets, and must not
      # be able to ship anything anyway — and its absence is a supported state
      # rather than a failure: this repository before the Play account existed
      # still built green and still produced something installable.
      - name: Look for signing material
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$KEYSTORE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Android signing material - building a debug APK to sideload, no App Bundle.'
          fi

      # --- Unsigned fallback: what a tester sideloaded before Play ----------
      - name: Build the debug APK
        if: steps.signing.outputs.available != 'true'
        run: flutter build apk --debug
      # Installable artifacts only from code that reached main: a fork PR
      # must not be able to publish an APK/IPA someone might sideload.
      - if: steps.signing.outputs.available != 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: patra-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # --- Signed App Bundle, which is the only thing Play accepts ----------
      # Gradle only discovers a bad password at the *end* of a four-minute
      # build, and says "keystore password was incorrect" without telling you
      # which of the three secrets is at fault. keytool answers all three
      # questions in a second, before anything is compiled.
      - name: Write the keystore, and check it opens
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                 -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore. A trailing newline counts as part of the password: set the secret with `printf %s`, not from a file.'
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo '::error::The keystore opens, but holds no key under the alias in ANDROID_KEY_ALIAS.'
            keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass "$STORE_PASSWORD" | grep -i 'alias' || true
            exit 1
          fi

          # A PKCS12 keystore has exactly one password — keytool says so when
          # you try to give it two — but Gradle is handed both and fails on
          # the mismatch far downstream.
          if [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo '::error::ANDROID_KEY_PASSWORD differs from ANDROID_KEYSTORE_PASSWORD. A PKCS12 keystore keeps one password for both; set the two secrets to the same value.'
            exit 1
          fi

          # build.gradle.kts reads this file if it is there and falls back to
          # the debug keys if it is not; writing it is the whole switch.
          cat > android/key.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build the App Bundle
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Play refuses a versionCode it has already accepted and wants each
          # one higher than the last; pubspec's "+1" never moves. Same reason,
          # same source, as the iOS build number.
          flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER"

      - if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: patra-release-aab
          path: ${{ env.AAB }}

      # --- Straight to the closed test, once Play knows the package ---------
      # The Play Developer API cannot create an application: the first bundle
      # has to go through the Console by hand. Until that is done there is no
      # service account to make one from, so this stays skipped rather than
      # red — and the AAB above is what gets uploaded manually.
      - name: Look for a Play service account
        id: play
        if: steps.signing.outputs.available == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Play service account - the App Bundle is an artifact to upload by hand.'
          fi

      # Pinned to a commit, not a tag: this step is handed the service account
      # key, and a tag can be moved under it.
      - name: Upload to the closed test track
        if: steps.play.outputs.available == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB }}
          # Internal testing: no review delay, up to 100 testers, and the
          # right place to iterate. Deliberately *not* the closed track —
          # which means this does not advance the twelve-testers-for-fourteen-
          # days clock a personal account must run before it may ask for
          # production access; only a closed test ("alpha") does. Switch this
          # one word when that clock needs to start.
          track: internal
          status: completed

      - name: Forget the signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

  build-ios:
    runs-on: macos-latest
    needs: analyze
    env:
      BUNDLE_ID: io.github.rbioteau.patra
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Signing material reaches this job only on a push to main — a fork PR
      # is handed no secrets, and must not be able to ship anything anyway.
      # Before the Apple account is wired up the secret is simply absent, and
      # the job falls back to what it has always done (an unsigned IPA to
      # re-sign and sideload) instead of turning main red.
      - name: Look for signing material
        id: signing
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$CERTIFICATE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No iOS signing material - building unsigned, not uploading to TestFlight.'
          fi

      # --- Unsigned fallback -------------------------------------------------
      # Release mode is required either way: a debug Flutter build needs JIT,
      # which iOS forbids outside a debugger.
      - name: Build unsigned
        if: steps.signing.outputs.available != 'true'
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        if: steps.signing.outputs.available != 'true' && github.event_name == 'push'
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr patra-unsigned.ipa Payload
      - if: steps.signing.outputs.available != 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: patra-unsigned-ipa
          path: patra-unsigned.ipa

      # --- Signed build, straight to TestFlight -------------------------------
      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # This keychain lives and dies with the runner, so its password is
          # generated here rather than being one more secret to rotate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops on a keychain-access prompt that a
          # headless runner can never answer, and the job hangs to its timeout.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          # Xcode 16 reads profiles from its own UserData directory, earlier
          # xcodebuild from the historical one. Install into both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/"
          done

      - name: Resolve the profile and write ExportOptions.plist
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # The profile names itself; reading it back beats hardcoding a name
          # that has to match whatever was typed into the Apple portal.
          plist=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          name=$(printf '%s' "$plist" | plutil -extract Name raw -)
          app_id=$(printf '%s' "$plist" | plutil -extract Entitlements.application-identifier raw -)
          echo "Provisioning profile: $name ($app_id)"
          # A profile for the wrong app fails deep inside xcodebuild with
          # "No profiles were found"; say what is actually wrong instead.
          if [ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Profile is for $app_id, expected $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

          # "app-store-connect" is the Xcode 15.3+ spelling of what used to be
          # called "app-store".
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$name</string></dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Sign the Runner target and build the IPA
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Release.xcconfig is the base configuration of the Runner *target*,
          # and that is the whole point of writing signing here. On xcodebuild's
          # command line the same settings reach every target in the build,
          # including the Swift Package Manager packages Flutter now uses for
          # plugins, and those fail the archive outright with "does not support
          # provisioning profiles". Being a target xcconfig it also outranks the
          # project-level CODE_SIGN_IDENTITY = "iPhone Developer" that the
          # Flutter template ships, which is a development identity TestFlight
          # rejects. Both spellings of the identity are set because the one it
          # has to beat is written with an sdk condition.
          cat >> ios/Flutter/Release.xcconfig <<XCCONFIG

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          XCCONFIG

          # With DEVELOPMENT_TEAM now in the build settings the flutter tool
          # skips its hunt for a *development* certificate (code_signing.dart),
          # which this runner could never satisfy, so the supported one-shot
          # command works and there is no bare xcodebuild to keep in step.
          # App Store Connect refuses a build number it has already seen, and
          # pubspec's "+1" never moves.
          flutter build ipa --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool takes no path to the key: it looks the file up by ID under
          # one of a few fixed directories, and the name has to be exact.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa=$(ls build/ios/ipa/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Forget the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
