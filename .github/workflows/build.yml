name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
      # Installable artifacts only from code that reached main: a fork PR
      # must not be able to publish an APK/IPA someone might sideload.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: patra-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    runs-on: macos-latest
    needs: analyze
    env:
      BUNDLE_ID: io.github.rbioteau.patra
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Signing material reaches this job only on a push to main — a fork PR
      # is handed no secrets, and must not be able to ship anything anyway.
      # Before the Apple account is wired up the secret is simply absent, and
      # the job falls back to what it has always done (an unsigned IPA to
      # re-sign and sideload) instead of turning main red.
      - name: Look for signing material
        id: signing
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$CERTIFICATE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No iOS signing material - building unsigned, not uploading to TestFlight.'
          fi

      # --- Unsigned fallback -------------------------------------------------
      # Release mode is required either way: a debug Flutter build needs JIT,
      # which iOS forbids outside a debugger.
      - name: Build unsigned
        if: steps.signing.outputs.available != 'true'
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        if: steps.signing.outputs.available != 'true' && github.event_name == 'push'
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr patra-unsigned.ipa Payload
      - if: steps.signing.outputs.available != 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: patra-unsigned-ipa
          path: patra-unsigned.ipa

      # --- Signed build, straight to TestFlight -------------------------------
      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # This keychain lives and dies with the runner, so its password is
          # generated here rather than being one more secret to rotate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops on a keychain-access prompt that a
          # headless runner can never answer, and the job hangs to its timeout.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          # Xcode 16 reads profiles from its own UserData directory, earlier
          # xcodebuild from the historical one. Install into both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/"
          done

      - name: Resolve the profile and write ExportOptions.plist
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # The profile names itself; reading it back beats hardcoding a name
          # that has to match whatever was typed into the Apple portal.
          plist=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          name=$(printf '%s' "$plist" | plutil -extract Name raw -)
          app_id=$(printf '%s' "$plist" | plutil -extract Entitlements.application-identifier raw -)
          echo "Provisioning profile: $name ($app_id)"
          # A profile for the wrong app fails deep inside xcodebuild with
          # "No profiles were found"; say what is actually wrong instead.
          if [ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Profile is for $app_id, expected $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

          # "app-store-connect" is the Xcode 15.3+ spelling of what used to be
          # called "app-store".
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$name</string></dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive and export
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # App Store Connect refuses a build number it has already seen, so
          # pubspec's frozen "+1" cannot be the one that ships. run_number only
          # ever grows.
          # --no-codesign despite this being the signed path, and it is load
          # bearing: the flutter tool looks for a *development* identity before
          # it honours --config-only (ios/mac.dart), and this runner only ever
          # holds a distribution certificate, so the check can never pass. The
          # flag cannot weaken the archive below — it only adds
          # CODE_SIGNING_ALLOWED=NO to an xcodebuild invocation that
          # --config-only returns before ever making.
          flutter build ios --release --config-only --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER"

          # Signing is passed on the command line rather than committed to the
          # Xcode project: it keeps the team ID in a secret, and command-line
          # settings are the only ones that outrank the project's inherited
          # CODE_SIGN_IDENTITY = "iPhone Developer", which would otherwise pick
          # a development identity that TestFlight rejects.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Patra.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Patra.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool takes no path to the key: it looks the file up by ID under
          # one of a few fixed directories, and the name has to be exact.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Forget the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
