name: Build

# A tag is what ships. `main` and pull requests still compile and test — the
# only way to catch a build that no Dart test can see — but nothing signed
# leaves them, and nothing reaches a store until a `v*` tag is pushed.
#
# workflow_dispatch is the recovery hatch: run it against a tag
# (`gh workflow run build.yml --ref v0.1.0`) to re-ship a release that failed
# halfway. A GitHub *re-run* keeps its run number, which both stores would
# reject as one they have already seen; a fresh dispatch gets a new one.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The tag *is* the version: it is passed to `--build-name`, which writes
      # Android's versionName and iOS's CFBundleShortVersionString, and the app
      # reads its own version back out of that at startup (ClientIdentity, via
      # package_info_plus) instead of compiling one in. So a release needs no
      # commit — nothing in the repository has to be bumped to match — but the
      # tag has to be a version, since nothing else will be checking.
      - name: The tag is the version, so it has to be one
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # App Store Connect takes CFBundleShortVersionString as one to three
          # dot-separated integers and nothing else; Android's versionName
          # takes any string. Hold both to the stricter shape, or the two
          # stores end up showing different versions of the same release.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version. Release tags are v<major>.<minor>.<patch> — v0.2.0, not v0.2 and not v0.2.0-rc1."
            exit 1
          fi
          echo "Releasing $version (build $GITHUB_RUN_NUMBER)."

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    env:
      PACKAGE_NAME: io.github.rbioteau.patra
      AAB: build/app/outputs/bundle/release/app-release.aab
      # A `v*` tag — pushed, or dispatched against one — is the only thing
      # that ships. Read from the *ref*, not the event name, so a dispatch
      # recovering a release takes the same path a tag push does.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The same rule the iOS job follows. The signed path is taken only for a
      # release ref that also has the secrets: a fork PR is handed none, and
      # must not be able to ship anything anyway. Their absence is a supported
      # state rather than a failure — this repository before the Play account
      # existed still built green and still produced something installable —
      # and so is a plain push to main, which now builds the same fallback.
      - name: Look for signing material
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$RELEASE" = true ] && [ -n "$KEYSTORE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = true ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Android signing material - building a debug APK to sideload, no App Bundle.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Not a v* tag - building a debug APK, shipping nothing.'
          fi

      # --- Unsigned fallback: what a tester sideloaded before Play ----------
      - name: Build the debug APK
        if: steps.signing.outputs.available != 'true'
        run: flutter build apk --debug
      # Installable artifacts only from code that reached the repository: a
      # fork PR must not be able to publish an APK/IPA someone might sideload.
      # A push to main still leaves one, which is how a tester gets at what is
      # not yet tagged.
      - if: steps.signing.outputs.available != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: patra-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # --- Signed App Bundle, which is the only thing Play accepts ----------
      # Gradle only discovers a bad password at the *end* of a four-minute
      # build, and says "keystore password was incorrect" without telling you
      # which of the three secrets is at fault. keytool answers all three
      # questions in a second, before anything is compiled.
      - name: Write the keystore, and check it opens
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.p12"

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.p12" \
                 -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore. A trailing newline counts as part of the password: set the secret with `printf %s`, not from a file.'
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/upload.p12" \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo '::error::The keystore opens, but holds no key under the alias in ANDROID_KEY_ALIAS.'
            keytool -list -keystore "$RUNNER_TEMP/upload.p12" \
              -storepass "$STORE_PASSWORD" | grep -i 'alias' || true
            exit 1
          fi

          # A PKCS12 keystore has exactly one password — keytool says so when
          # you try to give it two — but Gradle is handed both and fails on
          # the mismatch far downstream.
          if [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo '::error::ANDROID_KEY_PASSWORD differs from ANDROID_KEYSTORE_PASSWORD. A PKCS12 keystore keeps one password for both; set the two secrets to the same value.'
            exit 1
          fi

          # build.gradle.kts reads this file if it is there and falls back to
          # the debug keys if it is not; writing it is the whole switch.
          cat > android/key.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/upload.p12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build the App Bundle
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # THE BUILD NUMBER IS THE RUN NUMBER, AND HAS TO STAY THAT WAY.
          # Play refuses a versionCode it has already accepted and wants each
          # one higher than the last; App Store Connect refuses a build number
          # it has already seen. pubspec's "+1" never moves, and the tag cannot
          # supply one either: read as a number, v0.2.0 is not above the run
          # numbers already sitting in both stores (25 and counting), and a
          # second build of a version would repeat itself.
          # GITHUB_RUN_NUMBER is the only counter that only ever goes up. It
          # counts every run of *this workflow file* — pull requests and main
          # pushes included — so the numbers jump between releases, which is
          # fine: both stores ask for increasing, not consecutive. Both
          # platform jobs are in the same run, so a tag ships one number to
          # the two stores. Renaming this file, or its `name:`, restarts the
          # count at 1 and every upload after that is rejected: don't.
          # --build-name is the tag, and pubspec's version is only ever the
          # default a local build falls back to. The app reads the name back
          # from the platform at runtime, so this is also the version Kavita
          # is told in the User-Agent.
          version="${GITHUB_REF_NAME#v}"
          flutter build appbundle --release \
            --build-name="$version" \
            --build-number="$GITHUB_RUN_NUMBER"

          # A release bundle once shipped with no INTERNET permission, because
          # Flutter declares it only in the debug and profile manifests and
          # nothing else notices: the app installed, opened, and failed every
          # request at the connection. No Dart test can see this, so the built
          # artefact is asked directly.
          # -a because a bundle's manifest is protobuf: some greps call that
          # binary and report no match even when the string is there.
          unzip -p "$AAB" base/manifest/AndroidManifest.xml \
            | grep -qa 'android.permission.INTERNET' || {
              echo '::error::The bundle declares no INTERNET permission - the app would install and reach nothing.'
              exit 1
            }

          # The tag is the only place the version now lives, so check it
          # actually reached the artefact rather than trusting the flag.
          unzip -p "$AAB" base/manifest/AndroidManifest.xml \
            | grep -qa "$version" || {
              echo "::error::The bundle does not carry versionName $version."
              exit 1
            }

      - if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: patra-release-aab
          path: ${{ env.AAB }}

      # --- Straight to the internal test, once Play knows the package -------
      # The Play Developer API cannot create an application: the first bundle
      # has to go through the Console by hand. Until that is done there is no
      # service account to make one from, so this stays skipped rather than
      # red — and the AAB above is what gets uploaded manually.
      - name: Look for a Play service account
        id: play
        if: steps.signing.outputs.available == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No Play service account - the App Bundle is an artifact to upload by hand.'
          fi

      # Pinned to a commit, not a tag: this step is handed the service account
      # key, and a tag can be moved under it.
      - name: Upload to the internal test track
        if: steps.play.outputs.available == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB }}
          # Play shows a release by its name, not by the versionCode, and left
          # to itself the action would call it "25 (0.1.0)". The tag is the
          # release.
          releaseName: ${{ github.ref_name }}
          # Internal testing: no review delay, up to 100 testers, and the
          # right place to iterate. Deliberately *not* the closed track —
          # which means this does not advance the twelve-testers-for-fourteen-
          # days clock a personal account must run before it may ask for
          # production access; only a closed test ("alpha") does. Switch this
          # one word when that clock needs to start.
          #
          # `tracks`, plural, comma-separated: the singular `track` is
          # deprecated, and setting both is a hard error rather than a
          # warning. Never leave it out — the action's default is
          # *production*.
          tracks: internal
          status: completed

      - name: Forget the signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.p12"

  build-ios:
    runs-on: macos-latest
    needs: analyze
    env:
      BUNDLE_ID: io.github.rbioteau.patra
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The signed path is taken only for a `v*` tag that also has the
      # secrets — a fork PR is handed none, and must not be able to ship
      # anything anyway. Before the Apple account is wired up the secret is
      # simply absent, and the job falls back to what it has always done (an
      # unsigned IPA to re-sign and sideload) instead of turning main red. A
      # push to main takes the same fallback now: it compiles, it ships
      # nothing.
      - name: Look for signing material
        id: signing
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
        run: |
          if [ "$RELEASE" = true ] && [ -n "$CERTIFICATE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = true ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No iOS signing material - building unsigned, not uploading to TestFlight.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Not a v* tag - building unsigned, shipping nothing.'
          fi

      # --- Unsigned fallback -------------------------------------------------
      # Release mode is required either way: a debug Flutter build needs JIT,
      # which iOS forbids outside a debugger.
      - name: Build unsigned
        if: steps.signing.outputs.available != 'true'
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        if: steps.signing.outputs.available != 'true' && github.event_name != 'pull_request'
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr patra-unsigned.ipa Payload
      - if: steps.signing.outputs.available != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: patra-unsigned-ipa
          path: patra-unsigned.ipa

      # --- Signed build, straight to TestFlight -------------------------------
      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE: ${{ secrets.IOS_DIST_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # This keychain lives and dies with the runner, so its password is
          # generated here rather than being one more secret to rotate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops on a keychain-access prompt that a
          # headless runner can never answer, and the job hangs to its timeout.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          # Xcode 16 reads profiles from its own UserData directory, earlier
          # xcodebuild from the historical one. Install into both.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/"
          done

      - name: Resolve the profile and write ExportOptions.plist
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # The profile names itself; reading it back beats hardcoding a name
          # that has to match whatever was typed into the Apple portal.
          plist=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
          name=$(printf '%s' "$plist" | plutil -extract Name raw -)
          app_id=$(printf '%s' "$plist" | plutil -extract Entitlements.application-identifier raw -)
          echo "Provisioning profile: $name ($app_id)"
          # A profile for the wrong app fails deep inside xcodebuild with
          # "No profiles were found"; say what is actually wrong instead.
          if [ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Profile is for $app_id, expected $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

          # "app-store-connect" is the Xcode 15.3+ spelling of what used to be
          # called "app-store".
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$name</string></dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Sign the Runner target and build the IPA
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Release.xcconfig is the base configuration of the Runner *target*,
          # and that is the whole point of writing signing here. On xcodebuild's
          # command line the same settings reach every target in the build,
          # including the Swift Package Manager packages Flutter now uses for
          # plugins, and those fail the archive outright with "does not support
          # provisioning profiles". Being a target xcconfig it also outranks the
          # project-level CODE_SIGN_IDENTITY = "iPhone Developer" that the
          # Flutter template ships, which is a development identity TestFlight
          # rejects. Both spellings of the identity are set because the one it
          # has to beat is written with an sdk condition.
          cat >> ios/Flutter/Release.xcconfig <<XCCONFIG

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          XCCONFIG

          # With DEVELOPMENT_TEAM now in the build settings the flutter tool
          # skips its hunt for a *development* certificate (code_signing.dart),
          # which this runner could never satisfy, so the supported one-shot
          # command works and there is no bare xcodebuild to keep in step.
          # Same name and same number as the App Bundle, same sources: the
          # tag and the run. See "Build the App Bundle" in the Android job.
          flutter build ipa --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool takes no path to the key: it looks the file up by ID under
          # one of a few fixed directories, and the name has to be exact.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa=$(ls build/ios/ipa/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Forget the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
