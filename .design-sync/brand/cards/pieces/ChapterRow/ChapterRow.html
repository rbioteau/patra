<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChapterRow</title>
<link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../cards.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round"></head>
<body>
<div class="pt-screen" style="padding-top:0;padding-bottom:0">
  <div class="pt-row pt-row--now">
    <div class="pt-cover pt-cover--row"><span class="pt-cover__spine"></span>V</div>
    <div class="pt-row__body"><div class="pt-row__title" style="color:var(--patra-accent)">Chapter 12 - The duel</div><div class="pt-row__meta">Page 14 / 26</div><div class="pt-row__track"><i style="width:54%"></i></div></div>
    <span class="pt-pill" style="color:var(--patra-offline)"><span class="pt-ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-track)" stroke-width="2"/><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-offline)" stroke-width="2" stroke-dasharray="69.12" stroke-dashoffset="40.09"/></svg><span class="pt-icon">pause</span></span>Downloading</span>
  </div>
  <div class="pt-row">
    <div class="pt-cover pt-cover--row"><span class="pt-cover__spine"></span>V</div>
    <div class="pt-row__body"><div class="pt-row__title">Chapter 13 - Across the sea</div><div class="pt-row__meta">24 pages</div></div>
    <span class="pt-pill" style="color:var(--patra-text-muted)"><span class="pt-icon">save_alt</span>Save</span>
  </div>
  <div class="pt-row">
    <span class="pt-row__rail"></span>
    <div class="pt-cover pt-cover--row"><span class="pt-cover__spine"></span>V</div>
    <div class="pt-row__body"><div class="pt-row__title">Chapter 11 - Thors</div><div class="pt-row__meta">Read · 26 pages</div></div>
    <span class="pt-saved" title="Saved"><span class="pt-icon">check</span></span>
  </div>
</div>
</body>
</html>
