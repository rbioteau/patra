<!doctype html>
<html>
<head><meta charset="utf-8"><title>BatchCard</title>
<link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../cards.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round"></head>
<body>
<div class="pt-screen" style="display:grid;gap:10px">
  <div class="pt-batch"><span class="pt-batch__glyph"><span class="pt-icon">save_alt</span></span><div><div class="pt-batch__title">Download what's next</div><div class="pt-batch__sub">Chapters 13 to 15 · 1 already saved</div></div></div>
  <div class="pt-batch pt-batch--lit"><span class="pt-batch__glyph"><span class="pt-icon">save_alt</span></span><div><div class="pt-batch__title">Downloading next 3…</div><div class="pt-batch__sub">2 of 3 saved</div></div><span class="pt-batch__bar"><i style="width:66%"></i></span></div>
  <div class="pt-batch pt-batch--done"><span class="pt-batch__glyph"><span class="pt-icon">check</span></span><div><div class="pt-batch__title">Next 3 saved</div><div class="pt-batch__sub">Ready to read offline</div></div></div>
</div>
</body>
</html>
