<!doctype html>
<html>
<head><meta charset="utf-8"><title>DownloadPill</title>
<link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../cards.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round"></head>
<body>
<div class="pt-screen" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
  <span class="pt-pill" style="color:var(--patra-text-muted)"><span class="pt-icon">save_alt</span>Save</span>
  <span class="pt-pill" style="color:var(--patra-offline)"><span class="pt-ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-track)" stroke-width="2"/></svg><span class="pt-icon">pause</span></span>Waiting</span>
  <span class="pt-pill" style="color:var(--patra-offline)"><span class="pt-ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-track)" stroke-width="2"/><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-offline)" stroke-width="2" stroke-dasharray="69.12" stroke-dashoffset="40.09"/></svg><span class="pt-icon">pause</span></span>Downloading</span>
  <span class="pt-pill" style="color:var(--patra-text-muted)"><span class="pt-ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-track)" stroke-width="2"/><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-text-muted)" stroke-width="2" stroke-dasharray="69.12" stroke-dashoffset="27.65"/></svg><span class="pt-icon">play_arrow</span></span>Resume</span>
  <span class="pt-pill" style="color:var(--patra-danger)"><span class="pt-ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-track)" stroke-width="2"/><circle cx="12" cy="12" r="11" fill="none" stroke="var(--patra-danger)" stroke-width="2" stroke-dasharray="69.12" stroke-dashoffset="48.38"/></svg><span class="pt-icon">refresh</span></span>Retry</span>
  <span class="pt-saved" title="Saved"><span class="pt-icon">check</span></span>
</div>
</body>
</html>
