<!doctype html>
<html>
<head><meta charset="utf-8"><title>SettingSwitch</title>
<link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../cards.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round"></head>
<body>
<div class="pt-screen" style="padding-top:0;padding-bottom:0">
  <div class="pt-setting"><span class="pt-setting__icon" style="color:var(--patra-offline)"><span class="pt-icon">signal_cellular_alt</span></span><div style="flex:1"><div class="pt-setting__title">Download on mobile data</div><div class="pt-setting__sub">Without asking first. When off, the app asks before each download away from Wi-Fi.</div></div><span class="pt-switch pt-switch--off"></span></div>
  <div class="pt-setting"><span class="pt-setting__icon" style="color:var(--patra-accent)"><span class="pt-icon">lock_outline</span></span><div style="flex:1"><div class="pt-setting__title">Lock this profile</div><div class="pt-setting__sub">Keeps the other people on this device out. Not protection against theft: what is stored here can still be read off it.</div></div><span class="pt-switch pt-switch--on"></span></div>
</div>
</body>
</html>
