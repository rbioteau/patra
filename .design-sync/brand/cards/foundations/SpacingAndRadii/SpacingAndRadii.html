<!-- @dsCard group="Foundations" height=440 subtitle="Margins, gaps, sizes, radii" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spacing and radii</title>
<link rel="stylesheet" href="../../../styles.css"><link rel="stylesheet" href="../../cards.css"></head>
<body>
<div class="pt-screen">
  <div class="pt-section">Spacing</div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-book-side-margin · 12</span><span class="pt-bar" style="width:var(--patra-book-side-margin)"></span></div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-gutter · 20</span><span class="pt-bar" style="width:var(--patra-gutter)"></span></div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-section-gap · 24</span><span class="pt-bar" style="width:var(--patra-section-gap)"></span></div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-gate-gutter · 32</span><span class="pt-bar" style="width:var(--patra-gate-gutter)"></span></div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-min-hit-target · 44</span><span class="pt-bar" style="width:var(--patra-min-hit-target)"></span></div>
  <div class="pt-scale-row"><span class="pt-scale-row__label">--patra-control-max-width · 280</span><span class="pt-bar" style="width:var(--patra-control-max-width)"></span></div>
  <div class="pt-section">Radii</div>
  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end">
    <div><div class="pt-radius-box" style="border-radius:var(--patra-radius-track)"></div><div class="pt-caption">track · 2</div></div>
    <div><div class="pt-radius-box" style="border-radius:var(--patra-radius-thumb)"></div><div class="pt-caption">thumb · 6</div></div>
    <div><div class="pt-radius-box" style="border-radius:var(--patra-radius-cover)"></div><div class="pt-caption">cover · 10</div></div>
    <div><div class="pt-radius-box" style="border-radius:var(--patra-radius-card)"></div><div class="pt-caption">card · 12</div></div>
    <div><div class="pt-radius-box" style="border-radius:var(--patra-radius-pill);width:96px;height:32px"></div><div class="pt-caption">pill · 999</div></div>
  </div>
  <div class="pt-section">Covers — always 2:3</div>
  <div style="display:flex;gap:18px;align-items:flex-end">
    <div><div class="pt-cover pt-cover--row">V</div><div class="pt-caption">row · 46×66</div></div>
    <div><div class="pt-cover pt-cover--hero">V</div><div class="pt-caption">hero · 124×182</div></div>
  </div>
</div>
</body>
</html>
